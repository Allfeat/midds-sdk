name: Release-plz

# Maintains a release PR with version bumps + CHANGELOG, and creates a
# single workspace tag + GitHub Release when the PR is merged. Runs in
# `git_only` mode (no cargo publish) per release-plz.toml.
#
# Note: the default `secrets.GITHUB_TOKEN` cannot trigger CI on the PRs
# this workflow opens. Two options before the first public release:
#
# 1. (Preferred) Replace `GITHUB_TOKEN` below with a `RELEASE_PLZ_TOKEN`
#    secret holding a Personal Access Token or a GitHub App installation
#    token. Required scopes: `repo` (PRs), `workflow` (re-trigger CI).
#    Once swapped, CI runs automatically on every release PR exactly like
#    it does on hand-crafted PRs.
#
# 2. (Stop-gap) Configure `master` as a protected branch with a required
#    status check on the `ci` workflow + the "Require branches to be up to
#    date" toggle. The release PR will need a manual `git pull --rebase`
#    + `git push` (or a `gh pr ready --undo` toggle) to re-trigger CI
#    before merge — no merge-without-CI loophole.
#
# Until either option is in place, treat release PRs as "manually verify
# CI on the underlying commits before merging".

on:
  push:
    branches:
      - master

jobs:
  release-plz-release:
    name: release-plz release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-plz-pr:
    name: release-plz PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
