[workspace]
resolver = "2"
members = [
    "crates/midds-traits",
    "crates/midds-types",
    "crates/midds-validate",
    "crates/midds-runtime-api",
    "crates/midds-rpc",
    "crates/midds-client",
    "crates/midds-codegen",
    "crates/midds-cli",
    "crates/midds-fixtures",
    "crates/midds-e2e",
    "pallets/pallet-midds",
]

[workspace.package]
authors = ["Allfeat labs. <hello@allfeat.com>"]
edition = "2024"
homepage = "https://allfeat.com"
license = "GPL-3.0"
repository = "https://github.com/allfeat/midds-sdk"
# 0.2.0 — breaking change: `pallet-midds::Config` no longer carries
# `DepositBase` / `DepositPerByte` as compile-time `Get` items. Both are now
# runtime-mutable `StorageValue`s, initialised from `pallet_midds::GenesisConfig`
# and tunable post-launch via the new `force_set_deposit_*` extrinsics
# (`docs/economics.md` §13.4). Pre-1.0 SemVer: any `0.x.0` bump is breaking.
version = "0.2.0"

[workspace.dependencies]
# Internal crates
midds-traits = { path = "crates/midds-traits", version = "0.2.0", default-features = false }
midds-types = { path = "crates/midds-types", version = "0.2.0", default-features = false }
midds-validate = { path = "crates/midds-validate", version = "0.2.0" }
midds-runtime-api = { path = "crates/midds-runtime-api", version = "0.2.0", default-features = false }
midds-rpc = { path = "crates/midds-rpc", version = "0.2.0" }
midds-client = { path = "crates/midds-client", version = "0.2.0" }
midds-codegen = { path = "crates/midds-codegen", version = "0.2.0" }
midds-fixtures = { path = "crates/midds-fixtures", version = "0.2.0", default-features = false }
pallet-midds = { path = "pallets/pallet-midds", version = "0.2.0", default-features = false }

# Polkadot SDK (no_std-capable) — aligned with stable2503
frame-support = { version = "46.0.0", default-features = false }
frame-system = { version = "46.0.0", default-features = false }
frame-benchmarking = { version = "46.0.0", default-features = false }
sp-api = { version = "41.0.0", default-features = false }
sp-core = { version = "40.0.0", default-features = false }
sp-io = { version = "45.0.0", default-features = false }
sp-runtime = { version = "46.0.0", default-features = false }
sp-blockchain = { version = "44.0.0", default-features = false }

pallet-balances = { version = "47.0.0", default-features = false }

# Substrate codec / scale
parity-scale-codec = { version = "3.7.4", default-features = false, features = ["derive", "max-encoded-len"] }
scale-info = { version = "2.11.6", default-features = false, features = ["derive"] }
# Bounded containers — pulled directly to keep `midds-traits` / `midds-types`
# free of the `frame-support → sp-io → secp256k1` chain that breaks browser
# WASM with unresolved `env` imports.
bounded-collections = { version = "0.3.2", default-features = false, features = ["scale-codec"] }

# Client (std)
jsonrpsee = { version = "0.24.3", features = ["server", "macros"] }
subxt = "0.50"
subxt-signer = "0.50"
subxt-codegen = "0.50"
subxt-utils-fetchmetadata = { version = "0.50", default-features = false }
scale-value = { version = "0.18", default-features = false, features = ["std"] }

# Async
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Validation
regex = "1.10"
thiserror = "1"

# Serialization
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = "1"

# CLI
clap = { version = "4.5", features = ["derive"] }
dialoguer = "0.11"
# `console` (terminal styling) and `indicatif` (spinners / progress bars) drive
# the modern, dynamic operator UX. `console` is already pulled transitively by
# `dialoguer`, so pinning it here costs nothing extra; both share the same
# `Term` abstraction so styled prompts and progress bars don't fight over the
# cursor.
console = "0.15"
indicatif = "0.17"
anyhow = "1"
log = { version = "0.4", default-features = false }

# Test fixtures / property-based testing
proptest = "1"
rand = { version = "0.8", default-features = false, features = ["std", "std_rng"] }
rand_chacha = { version = "0.3", default-features = false, features = ["std"] }

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = "thin"
panic = "unwind"

[profile.production]
inherits = "release"
codegen-units = 1
lto = "fat"
strip = true
