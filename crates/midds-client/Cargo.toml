[package]
name = "midds-client"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Subxt-based Rust client for the Allfeat MIDDS pallets."

[dependencies]
midds-runtime-api = { workspace = true, features = ["std"] }
midds-traits = { workspace = true, features = ["std"] }
midds-types = { workspace = true, features = ["std"] }

parity-scale-codec = { workspace = true, features = ["std"] }
subxt = { workspace = true }
subxt-signer = { workspace = true }

thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
# Used by the compile-only `generic_check` test in `pallet/api.rs` to prove
# `PalletApi<M>` doesn't leak any payload-specific bound. The dummy MIDDS type
# needs `scale_info::TypeInfo` (via the `Parameter` bound on `Midds`); the
# `parity-scale-codec` derives (`MaxEncodedLen`, `Encode`, `Decode`,
# `DecodeWithMemTracking`) are already pulled in by `midds-traits` →
# `frame-support` with the right features, so no extra codec entry is needed.
scale-info = { workspace = true, features = ["std", "derive"] }
