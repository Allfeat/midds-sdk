[package]
name = "midds-traits"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Core traits and identifier types for Allfeat MIDDS."

[dependencies]
# `bounded-collections` instead of `frame-support` — same `BoundedVec` /
# `ConstU32` types (frame-support just re-exports them) but without the
# `sp-io → secp256k1` chain that breaks browser WASM consumers.
bounded-collections = { workspace = true }
parity-scale-codec = { workspace = true }
scale-info = { workspace = true }
serde = { workspace = true, optional = true }

[features]
default = ["std"]
std = [
    "bounded-collections/std",
    "parity-scale-codec/std",
    "scale-info/std",
    "serde?/std",
]
serde = [
    "dep:serde",
    "scale-info/serde",
]
