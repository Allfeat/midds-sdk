[package]
name = "pallet-midds"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Generic multi-instance FRAME pallet managing the lifecycle of MIDDS records."

[dependencies]
# FRAME via the umbrella crate: `frame::prelude` / `frame::testing_prelude` /
# `frame::benchmarking::prelude` / `frame::deps` replace the individual
# frame-support / frame-system / frame-benchmarking / sp-runtime dependencies.
frame = { workspace = true }
midds-traits = { workspace = true }
# `parity-scale-codec` and `scale-info` stay direct: the `#[derive(Encode,
# Decode, TypeInfo, …)]` macros resolve their crate by name, and the code uses
# explicit `parity_scale_codec::` paths (e.g. `DecodeWithMemTracking`).
parity-scale-codec = { workspace = true }
scale-info = { workspace = true }

[dev-dependencies]
midds-fixtures = { workspace = true, features = ["proptest", "corpus"] }
midds-types = { workspace = true, features = ["std"] }
pallet-balances = { workspace = true, features = ["std"] }
proptest = { workspace = true }
serde_json = { workspace = true }
# `sp-core` / `sp-io` are reached through `frame::deps` in the mock and tests.

[features]
default = ["std"]
std = [
    "frame/std",
    # `frame`'s `std` compiles its `runtime` module (executive + runtime APIs),
    # whose api re-exports only link under the `runtime` feature — required by
    # `frame::testing_prelude`, which the mock and tests pull in.
    "frame/runtime",
    "midds-traits/std",
    "parity-scale-codec/std",
    "scale-info/std",
]
runtime-benchmarks = [
    "frame/runtime-benchmarks",
    "pallet-balances/runtime-benchmarks",
]
try-runtime = [
    "frame/try-runtime",
]
